name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AFA0A1: ${{ secrets.AFA0A1 }}
          B8330E: ${{ secrets.B8330E }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('AFA0A1', '')
          sec_b = os.environ.get('B8330E', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 3a3897c4a79812aadf034707b0f48578 -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 75f2749f76ee85ba -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
