<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital Overload: Idle Defense</title>
<meta name="description" content="Turrets, endless upgrades and epic bosses: defend your pixel-art planet!">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e8ecf8;
    background:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 32%, #cfe0ff 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 71%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 61% 86%, #ffe9c2 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 64%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 44%, #cfe0ff 50%, transparent 51%),
      radial-gradient(ellipse at 50% 120%, #1b2a5c 0%, #0a0e1f 60%, #05070f 100%);
    background-attachment: fixed;
  }
  main { width: 100%; max-width: 460px; text-align: center; }
  img.icon {
    width: 128px; height: 128px; border-radius: 28px;
    image-rendering: pixelated;
    box-shadow: 0 0 0 1px #ffffff22, 0 12px 40px #2f6bff55;
  }
  h1 { margin: 24px 0 8px; font-size: 1.75rem; letter-spacing: .02em; }
  p.tagline { margin: 0 0 28px; color: #aab4d4; line-height: 1.5; }
  a.play {
    display: inline-block; padding: 14px 28px; border-radius: 999px;
    background: #3d7bff; color: #fff; font-weight: 600; text-decoration: none;
  }
  a.play:hover, a.play:focus-visible { background: #5a90ff; }
  nav { margin-top: 32px; font-size: .9rem; }
  nav a { color: #9fb6ff; text-decoration: none; margin: 0 10px; white-space: nowrap; }
  nav a:hover, nav a:focus-visible { text-decoration: underline; }
  footer { margin-top: 40px; font-size: .75rem; color: #6b7699; }
  [data-lang="es"] { display: none; }
  html[lang="es"] [data-lang="es"] { display: revert; }
  html[lang="es"] [data-lang="en"] { display: none; }
</style>
<script>
  if ((navigator.language || "").toLowerCase().indexOf("es") === 0) {
    document.documentElement.lang = "es";
    document.title = "Orbital Overload: Defensa Idle";
  }
</script>
</head>
<body>
<main>
  <img class="icon" src="icon.png" width="128" height="128" alt="Orbital Overload">
  <h1>Orbital Overload</h1>

  <p class="tagline" data-lang="en">Turrets, endless upgrades and epic bosses: defend your pixel-art planet!</p>
  <p class="tagline" data-lang="es">Torretas, mejoras sin fin y jefes épicos: ¡defiende tu planeta en pixel art!</p>

  <a class="play" href="https://play.google.com/store/apps/details?id=com.orbitaloverload.game">
    <span data-lang="en">Get it on Google Play</span>
    <span data-lang="es">Disponible en Google Play</span>
  </a>

  <nav>
    <a href="https://sites.google.com/view/orbitaloverload">
      <span data-lang="en">Privacy policy</span>
      <span data-lang="es">Política de privacidad</span>
    </a>
    <a href="mailto:orbitaloverload.game@gmail.com">
      <span data-lang="en">Contact</span>
      <span data-lang="es">Contacto</span>
    </a>
  </nav>

  <footer>&copy; 2026 Orbital Overload</footer>
</main>
</body>
</html>
